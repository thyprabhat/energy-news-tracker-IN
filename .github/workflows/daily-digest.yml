name: Daily Energy News Digest

on:
  schedule:
    # 07:00 IST = 01:30 UTC. GitHub cron is UTC.
    - cron: "30 1 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the digest back to the repo

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python energy_news_tracker.py

      - name: Commit digest and updated seen-list
        run: |
          git config user.name "energy-news-bot"
          git config user.email "energy-news-bot@users.noreply.github.com"
          git add digests/ seen.json
          git diff --quiet --cached || git commit -m "Daily digest $(date -u +%F)"
          git push
